<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투자 일지</title>
<meta name="theme-color" content="#0d6b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 배치: 왼쪽은 장부 목록, 오른쪽은 한 장. 휴대폰에서는 한 번에 한 쪽만 보인다. */
  --paper:#eef2ef; --surface:#ffffff; --ink:#17201e; --muted:#5a6663; --line:#d2d9d4;
  --accent:#0d6b5c; --accent-ink:#ffffff; --chip:#e4e9e5;
  --up:#c5352b; --down:#2257b5; --warn:#96590a;
  --f-display:'Gowun Batang','Nanum Myeongjo','AppleMyungjo',serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11171a; --surface:#192125; --ink:#e4eae7; --muted:#93a09b; --line:#2b373b;
    --accent:#4fc4ae; --accent-ink:#06211c; --chip:#243035;
    --up:#ff7d70; --down:#7ba8ff; --warn:#e2ab4f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11171a; --surface:#192125; --ink:#e4eae7; --muted:#93a09b; --line:#2b373b;
  --accent:#4fc4ae; --accent-ink:#06211c; --chip:#243035;
  --up:#ff7d70; --down:#7ba8ff; --warn:#e2ab4f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}

.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;letter-spacing:-.01em}
.brand-mark{width:10px;height:22px;align-self:center;background:linear-gradient(var(--up) 0 50%,var(--down) 50% 100%);border-radius:2px}
.tabs{display:flex;gap:4px;flex:1;min-width:0}
.tabs a{padding:6px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--surface)}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"] .dot{background:var(--accent)}
.sync[data-s="saving"] .dot{background:var(--warn)}
.sync[data-s="err"] .dot,.sync[data-s="off"] .dot{background:var(--up)}
.sync button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,380px) 1fr}
.main.wide{grid-template-columns:1fr}
.main.wide .side{display:none}
.side{border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;min-height:0}
.detail{overflow:auto;min-height:0}
@media (max-width:860px){
  .main{grid-template-columns:1fr}
  .main .detail{display:none}
  .main.show-detail .side{display:none}
  .main.show-detail .detail,.main.wide .detail{display:block}
  .top{padding:10px 16px}
}
.btn.back{display:none}
@media (max-width:860px){.btn.back{display:inline-flex}}
@media (max-width:560px){.tabs{order:3;flex:1 0 100%;overflow-x:auto}.sync{margin-left:auto}}

/* 목록 쪽 */
.side-head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:2}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.strip div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.strip small{display:block;color:var(--muted);font-size:11.5px}
.strip b{font-size:15px;font-weight:600;white-space:nowrap}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 10px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--ink);font-weight:600}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:13.5px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--up)}
.btn:disabled{opacity:.5;cursor:default}
.rows{list-style:none;margin:0;padding:8px;display:flex;flex-direction:column;gap:6px}
.row{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.row[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{grid-column:1/-1;color:var(--muted);font-size:13px}
.row .r{font-weight:600;white-space:nowrap}
.row.empty-day{background:transparent;border-style:dashed}
.row.empty-day .t{font-weight:500;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--chip);vertical-align:middle;white-space:nowrap}
.pill.s-hold{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.pill.s-win{background:color-mix(in srgb,var(--up) 14%,var(--surface));color:var(--up)}
.pill.s-loss{background:color-mix(in srgb,var(--down) 14%,var(--surface));color:var(--down)}
.tag{display:inline-block;font-size:12px;padding:0 6px;border-radius:5px;background:var(--chip);margin-right:4px}
.album{list-style:none;margin:0;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.card[aria-current="true"]{border-color:var(--accent)}
.card .cover{aspect-ratio:4/3;background:var(--chip);display:grid;place-items:center;color:var(--muted);font-size:12.5px}
.card .cover img{width:100%;height:100%;object-fit:cover;display:block}
.card .cap{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.blank{padding:28px 20px;color:var(--muted);text-align:center}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h2{font-family:var(--f-display);font-size:19px;margin:0}

/* 한 장 */
.sheet{max-width:820px;margin:0 auto;padding:18px 24px 80px}
@media (max-width:860px){.sheet{padding:14px 16px 80px}}
.sheet-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sheet-bar .grow{flex:1}
.title-in{width:100%;border:0;border-bottom:2px solid var(--ink);background:transparent;font-family:var(--f-display);font-weight:700;font-size:30px;padding:4px 0;border-radius:0}
.title-in::placeholder{color:var(--muted);opacity:.6}
h2.day-title{font-family:var(--f-display);font-size:28px;margin:0 0 4px;text-wrap:balance}
.sub{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;margin:10px 0 6px;color:var(--muted);font-size:13.5px}
.sub b{color:var(--ink)}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.jump button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px}
.note{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:8px;padding:8px 12px;margin:10px 0;font-size:13.5px}
section.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:16px;scroll-margin-top:12px}
.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.sec-head .no{font-family:var(--f-display);font-weight:700;color:var(--accent);font-size:15px}
.sec-head h3{font-family:var(--f-display);font-size:20px;margin:0}
.sec-head .hint{color:var(--muted);font-size:13px;flex:1}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;padding:16px}
.f{grid-column:1/-1;min-width:0;display:flex;flex-direction:column;gap:5px}
.f.half{grid-column:auto}
@media (max-width:520px){.f.half{grid-column:1/-1}}
.f label,.f .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.req{font-size:11px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;margin-left:4px}
.f.missing .req{background:var(--accent);color:var(--accent-ink)}
.f input[type=text],.f input[type=date],.f input[type=datetime-local],.f textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;min-height:38px}
.f textarea{resize:none;overflow:hidden;line-height:1.55}
.f input::placeholder,.f textarea::placeholder{color:var(--muted);opacity:.65}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.chip.add{border-style:dashed;color:var(--muted)}
.chip-in{border:1px solid var(--accent);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;width:130px}
.calc{font-size:19px;font-weight:600;min-height:38px;display:flex;align-items:center}
.warnline{grid-column:1/-1;color:var(--warn);font-size:13px;margin:-6px 0 0}
.imgs{display:flex;flex-wrap:wrap;gap:8px;border:1px dashed var(--line);border-radius:10px;padding:10px;min-height:64px;align-items:center}
.imgs.active{border-color:var(--accent);border-style:solid}
.thumb{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:0;width:132px;height:96px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.wait{display:grid;place-items:center;color:var(--muted);font-size:12.5px}
.hint2{color:var(--muted);font-size:12.5px;margin:0}
.linklist{list-style:none;margin:0;padding:0 16px 14px;display:flex;flex-direction:column;gap:6px}
.linklist button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;text-align:left;width:100%}

/* 돌아보기 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile small{color:var(--muted);display:block;font-size:12.5px}
.tile b{font-size:22px;font-weight:600}
.tablewrap{overflow-x:auto}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st th,table.st td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st th{color:var(--muted);font-weight:600;font-size:12.5px}
table.st tr:last-child td{border-bottom:0}
.meter{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--chip);vertical-align:middle;margin-right:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--up)}
.lessons{list-style:none;margin:0;padding:6px 16px 14px;display:flex;flex-direction:column;gap:10px}
.lessons li{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.lessons small{color:var(--muted)}
.lessons p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.prose{padding:14px 16px}
.prose p{margin:0 0 10px}
.prose ol{margin:0;padding-left:22px}
.prose li{margin-bottom:4px}
.prose .bar{margin-top:4px}

/* 겹쳐 뜨는 것 */
.lb,.modal{position:fixed;inset:0;background:rgba(8,14,13,.82);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.lb[hidden],.modal[hidden],.toast[hidden]{display:none}
.lb-in{display:flex;flex-direction:column;gap:10px;max-width:100%;max-height:100%}
.lb img{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;background:#fff;border-radius:6px}
.lb .bar{justify-content:center}
.modal .box{background:var(--surface);border-radius:14px;padding:20px;max-width:380px;width:100%;border:1px solid var(--line)}
.modal p{margin:0 0 16px}
.modal .bar{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:30;max-width:calc(100% - 32px);font-size:14px}
@media (prefers-reduced-motion:no-preference){.row,.chip,.btn{transition:background-color .12s,border-color .12s}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1>투자 일지</h1></div>
    <nav class="tabs" aria-label="화면">
      <a href="#trades" data-tab="trades">매매 기록</a>
      <a href="#market" data-tab="market">시황 일지</a>
      <a href="#review" data-tab="review">돌아보기</a>
      <a href="#backup" data-tab="backup">백업·옮기기</a>
    </nav>
    <div class="sync" id="sync" role="status" data-s="wait"><span class="dot" aria-hidden="true"></span><span id="sync-text">여는 중</span><button type="button" id="sync-retry" hidden>다시 저장</button></div>
  </header>
  <main id="main" class="main">
    <aside id="side" class="side" aria-label="목록"></aside>
    <section id="detail" class="detail"></section>
  </main>
</div>
<div id="lb" class="lb" hidden>
  <div class="lb-in">
    <img id="lb-img" alt="차트 그림 크게 보기">
    <div class="bar"><button type="button" class="btn" id="lb-close">닫기</button><button type="button" class="btn danger" id="lb-del">이 그림 지우기</button></div>
  </div>
</div>
<div id="confirm" class="modal" hidden>
  <div class="box" role="alertdialog" aria-labelledby="confirm-msg">
    <p id="confirm-msg"></p>
    <div class="bar"><button type="button" class="btn" id="confirm-no">취소</button><button type="button" class="btn danger" id="confirm-yes">지우기</button></div>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum = v => typeof v === 'number' && isFinite(v);
const clone = o => JSON.parse(JSON.stringify(o));
const WD = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const nowLocal = () => { const d = new Date(); return ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtNum = n => isNum(n) ? n.toLocaleString('ko-KR', {maximumFractionDigits: 4}) : '';
const parseNum = s => { const t = String(s).replace(/[,\s]/g, ''); if (t === '' || t === '-') return null; const n = Number(t); return isFinite(n) ? n : null; };
const dayLabel = s => { const d = parseYmd(s); return (d.getMonth() + 1) + '/' + d.getDate() + ' (' + WD[d.getDay()] + ')'; };
const dayLong = s => { const d = parseYmd(s); return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + WD[d.getDay()] + '요일'; };

/* ---------- 고르는 값 ---------- */
const OPT = {
  status: ['보유','익절','손절','본전'],
  market: ['국내주식','미국주식','선물옵션','코인'],
  dir: ['매수','매도'],
  mMood: ['공포','불안','중립','낙관','과열'],
  myMood: ['차분함','조급함','머뭇거림','추격','손실 만회','과신'],
  method: ['주봉갭G','막양봉S','기타']
};
const MARKET_FIELDS = [
  {k:'mPos', l:'현재 위치', t:'text', ph:'지수가 월봉·주봉·일봉에서 어디에 있는지'},
  {k:'mIssue', l:'이슈', t:'area'},
  {k:'mVol', l:'거래대금', t:'text'},
  {k:'mWho', l:'매매주체', t:'text', ph:'외국인·기관·개인 동향'},
  {k:'mMood', l:'시장심리', t:'one', o:'mMood'}
];
const TRADE_SECS = [
  {id:'market', title:'시장', hint:'진입할 때의 시장 환경', pull:1, fields:[...MARKET_FIELDS, {k:'imgMarket', l:'시장 차트', t:'img'}]},
  {id:'me', title:'나', hint:'진입할 때의 내 상태', fields:[
    {k:'myMood', l:'나의 심리', t:'many', o:'myMood', req:1},
    {k:'account', l:'계좌 현황', t:'area', ph:'현금 비중, 보유 종목 수, 최근 손익 흐름'}]},
  {id:'stock', title:'종목', hint:'', fields:[
    {k:'code', l:'종목코드', t:'text', half:1},
    {k:'entryAt', l:'진입 일시', t:'datetime', half:1},
    {k:'market', l:'구분', t:'one', o:'market'},
    {k:'method', l:'기법', t:'one', o:'method', add:1},
    {k:'dir', l:'방향', t:'one', o:'dir'},
    {k:'entryPrice', l:'진입가격', t:'num', req:1, half:1},
    {k:'qty', l:'수량', t:'num', half:1},
    {k:'entryAmt', l:'진입금액', t:'num', req:1, half:1},
    {k:'sPos', l:'현재 자리', t:'area', ph:'월봉·주봉·일봉에서 지금 자리'},
    {k:'sFlow', l:'수급', t:'text'},
    {k:'sWho', l:'매매주체 특이사항', t:'text'},
    {k:'why', l:'왜 이 종목이었나', t:'area', req:1},
    {k:'whyNow', l:'왜 하필 그 타이밍이었나', t:'area', req:1},
    {k:'imgStock', l:'종목 차트', t:'img'}]},
  {id:'plan', title:'계획', hint:'진입 전에 정해 둡니다', fields:[
    {k:'target', l:'목표가격', t:'num', half:1},
    {k:'stop', l:'손절가격', t:'num', req:1, half:1},
    {k:'_rr', l:'손익비', t:'calc', half:1},
    {k:'_planwarn', t:'warn'},
    {k:'exitCond', l:'정리 조건', t:'area'},
    {k:'stopCond', l:'손절 조건', t:'area'},
    {k:'good', l:'기대 시나리오', t:'area'},
    {k:'bad', l:'실패 시나리오', t:'area'}]},
  {id:'result', title:'결과', hint:'정리한 뒤에 채웁니다', fields:[
    {k:'status', l:'상태', t:'one', o:'status'},
    {k:'exitDate', l:'정리일', t:'date', half:1},

const OK_IMG = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];

    const img = await loadImg(url), max = 2200, r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.88));

let toastT = 0;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3200); }

/* ---------- 시작 ---------- */
async function start(saved) {
  if (saved && saved.tab) { tab = saved.tab; month = saved.month || month; open = saved.open || null; filt = saved.filt || filt; view = saved.view || view; }
  else { const h = location.hash.slice(1); if (['trades', 'market', 'review', 'backup'].includes(h)) tab = h; }
  setTabMark(); renderAll(); setSync();
  try { local = await openLocal(); } catch (e) { local = null; }
  if (!local) { offline = true; loaded.trades = loaded.days = true; setSync(); renderAll(); return; }
  db = local; assets = local.assets; downloads = localDownloads;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(v => { persisted = v; if (tab === 'backup') renderDetail(); }).catch(() => {});
  if (!local.docs.has('meta/local')) { try { await db.doc('trades/example-1').set(EXAMPLE); await db.doc('meta/local').set({createdAt: Date.now()}); } catch (e) {} }
  const slowT = setTimeout(() => { if (!loaded.trades || !loaded.days) { slow = true; setSync(); } }, 10000);
  const done = () => { if (loaded.trades && loaded.days) clearTimeout(slowT); };
  db.collection('trades').onSnapshot(s => { onSnap('trades', s); done(); }, onErr);
  db.collection('days').onSnapshot(s => { onSnap('days', s); done(); }, onErr);
  db.doc('meta/options').onSnapshot(s => { const m = s.exists && s.data() && s.data().methods; if (Array.isArray(m) && m.length) { methods = m.filter(x => typeof x === 'string'); renderSide(); if (open) { for (const el of $$('.chips[data-o="method"]', detailEl)) delete el.dataset.sig; fillForm(); } } }, () => {});
  renderAll();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({tab, month, open, filt, view}));
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
